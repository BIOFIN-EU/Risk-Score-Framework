services:
  db:
    image: postgres:16.3
    ports:
      - "${DATABASE_PORT}:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DATABASE_USER -d $DATABASE_NAME || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  service:
    image: ghcr.io/biofin-eu/risk-score-framework:v1.0.0
    build:
      context: .
      args:
        SOURCE_REPO: ${SOURCE_REPO}

    # environment:
    #   SECRET_KEY: ${SECRET_KEY}
    #   DEBUG: ${DEBUG}
    #   DATABASE_HOST: db
    #   DATABASE_PORT: ${DATABASE_PORT}
    #   DATABASE_NAME: ${DATABASE_NAME}
    #   DATABASE_USER: ${DATABASE_USER}
    #   DATABASE_PASS: ${DATABASE_PASS}
    depends_on:
      db:
        condition: service_healthy
    # volumes:
    #   - .:/service
    ports:
      - "${APP_PORT}:${APP_PORT}"
